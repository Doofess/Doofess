  .value { font: 600 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #eaf2ff; }
  .node { font: 12px ui-monospace, SFMono-Regular, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #eaf2ff; }
  .name { font: 700 48px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; letter-spacing: -0.5px; fill: #eaf2ff; }
  .role { font: 600 14.5px ui-monospace, SFMono-Regular, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, 'Liberation Mono', monospace; letter-spacing: 1.2px; fill: #8fbaff; }
  .status { font: 700 12.5px ui-monospace, SFMono-Regular, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, 'Liberation Mono', monospace; letter-spacing: 1.1px; fill: #ffb454; }
  .dim { stroke: #9fb6d8; stroke-width: 1; }
  .arrow { stroke: #8fbaff; stroke-width: 1.4; fill: none; }
  .flow { stroke: #8fbaff; stroke-width: 1.4; stroke-dasharray: 4 4; animation: flow 1s linear infinite; }
  .pulse { fill: none; stroke: #ffb454; stroke-width: 1.5; transform-origin: 62px 204px; animation: pulse 2.4s ease-out infinite; }
  @keyframes flow { to { stroke-dashoffset: -8; } }
  @keyframes pulse { 0% { transform: scale(1); opacity: .9; } 70%, 100% { transform: scale(2.6); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } .pulse { opacity: 0; } }
</style>
